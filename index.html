
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eu te amo ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* FRASE INICIAL */
    #frase {
      color: white;
      font-size: clamp(38px, 10vw, 65px);
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
      transition: transform 0.2s;
      position: relative;
      z-index: 2;
    }

    #frase:active {
      transform: scale(0.92);
    }

    /* EXPLOSÃO DOS CONFETES */
    .confete {
      position: fixed;
      display: block;
      left: 0;
      top: 0;
      pointer-events: none;
      will-change: transform, opacity;
      animation: explodir var(--duracao) ease-out forwards;
    }

    @keyframes explodir {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translate(var(--x), var(--y))
                   rotate(var(--giro)) scale(0.5);
        opacity: 0;
      }
    }

    /* TELA FINAL DA FOTO */
    #imagem-final {
      display: none;
      position: fixed;
      inset: 0;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #050505;
      z-index: 5;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #imagem-final.visivel {
      opacity: 1;
    }

    /* FOTO INTERATIVA */
    .foto-container {
      position: relative;
      display: inline-block;
      max-width: 90vw;
      max-height: 75vh;
      line-height: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-radius: 16px;
      overflow: hidden;
      transition: box-shadow 0.7s ease;
    }

    .foto-container img {
      display: block;
      max-width: 90vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      transition: filter 0.7s ease;
    }

    /* CAMADA ROXA */
    .camada-roxa {
      position: absolute;
      inset: 0;
      background: rgba(145, 40, 255, 0.78);
      mix-blend-mode: color;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }

    /* LUZ ROXA AO REDOR DA FOTO */
    .foto-container.efeito-ativo {
      box-shadow:
        0 0 18px #a855f7,
        0 0 40px rgba(168, 85, 247, 0.8),
        0 0 70px rgba(128, 40, 255, 0.45);
    }

    .foto-container.efeito-ativo .camada-roxa {
      opacity: 1;
    }

    /* BRILHOS PULSANTES */
    .glitters {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glitter {
      position: absolute;
      color: #fff;
      font-size: 17px;
      line-height: 1;
      opacity: 0;
      text-shadow:
        0 0 5px #fff,
        0 0 12px #d8a5ff,
        0 0 22px #a020f0;
      animation: cintilar var(--tempo) ease-in-out infinite;
      animation-delay: var(--atraso);
    }

    @keyframes cintilar {
      0%, 100% {
        opacity: 0.1;
        transform: scale(0.4) rotate(0deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.5) rotate(45deg);
      }
    }

    .foto-container.efeito-ativo .glitter {
      opacity: 0.8;
    }

    /* INSTRUÇÃO */
    .dica {
      position: fixed;
      bottom: 35px;
      color: #777;
      font-size: 13px;
      letter-spacing: 2px;
      transition: opacity 0.5s;
    }

    /* INSTRUÇÃO DA FOTO */
    #dica-foto {
      display: none;
      position: fixed;
      bottom: 25px;
      color: #c9a3ff;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-align: center;
      z-index: 6;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #dica-foto.visivel {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="frase">Eu te amo</div>

  <div id="imagem-final">
    <div class="foto-container" id="foto-interativa">
      <img
        src="img/IMG_2364.jpeg"
        alt="Espero que se lembre de mim com amor"
      >
      <div class="camada-roxa"></div>
      <div class="glitters"></div>
    </div>
  </div>

  <div class="dica" id="dica">TOQUE NAS PALAVRAS</div>
  <div id="dica-foto">TOQUE NA FOTO PARA REVELAR A MAGIA ✨</div>

  <script>
    const frase = document.getElementById("frase");
    const imagemFinal = document.getElementById("imagem-final");
    const dica = document.getElementById("dica");
    const dicaFoto = document.getElementById("dica-foto");
    const foto = document.getElementById("foto-interativa");
    const areaGlitters = foto.querySelector(".glitters");

    let animando = false;

    // Cria os glitters uma única vez
    for (let i = 0; i < 32; i++) {
      const glitter = document.createElement("span");

      glitter.className = "glitter";
      glitter.textContent = Math.random() > 0.5 ? "✦" : "✧";

      glitter.style.left = (5 + Math.random() * 90) + "%";
      glitter.style.top = (5 + Math.random() * 90) + "%";
      glitter.style.fontSize = (10 + Math.random() * 15) + "px";

      glitter.style.setProperty(
        "--tempo",
        (1 + Math.random() * 2) + "s"
      );

      glitter.style.setProperty(
        "--atraso",
        (Math.random() * 3) + "s"
      );

      areaGlitters.appendChild(glitter);
    }

    // Clicar na frase dispara a explosão
    frase.addEventListener("click", () => {
      if (animando) return;

      animando = true;

      const ret = frase.getBoundingClientRect();
      const centroX = ret.left + ret.width / 2;
      const centroY = ret.top + ret.height / 2;

      frase.style.visibility = "hidden";
      dica.style.opacity = "0";

      const cores = [
        "#ff4d79",
        "#ffcf70",
        "#ffffff",
        "#c084fc",
        "#ff85d5",
        "#7df9d4"
      ];

      // Cria 180 partículas coloridas
      for (let i = 0; i < 180; i++) {
        const p = document.createElement("span");

        p.className = "confete";
        p.textContent = Math.random() > 0.7 ? "♥" : "▪";

        p.style.color =
          cores[Math.floor(Math.random() * cores.length)];

        p.style.fontSize =
          (Math.random() * 10 + 5) + "px";

        p.style.left = centroX + "px";
        p.style.top = centroY + "px";

        const angulo = Math.random() * Math.PI * 2;

        const distancia =
          80 + Math.random() *
          Math.max(window.innerWidth, window.innerHeight) * 0.55;

        const x = Math.cos(angulo) * distancia;

        // Gravidade faz os confetes caírem
        const y =
          Math.sin(angulo) * distancia +
          100 + Math.random() * 180;

        p.style.setProperty("--x", x + "px");
        p.style.setProperty("--y", y + "px");

        p.style.setProperty(
          "--giro",
          (Math.random() * 900 - 450) + "deg"
        );

        p.style.setProperty(
          "--duracao",
          (2.5 + Math.random() * 2) + "s"
        );

        document.body.appendChild(p);

        p.addEventListener("animationend", () => {
          p.remove();
        });
      }

      // Mostra a foto após a explosão
      setTimeout(() => {
        imagemFinal.style.display = "flex";

        requestAnimationFrame(() => {
          imagemFinal.classList.add("visivel");
        });

        dicaFoto.style.display = "block";

        requestAnimationFrame(() => {
          dicaFoto.classList.add("visivel");
        });
      }, 4600);
    });

    // Tocar na foto liga ou desliga o efeito roxo
    foto.addEventListener("click", () => {
      foto.classList.toggle("efeito-ativo");
    });
  </script>

</body>
</html>
