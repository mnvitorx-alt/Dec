
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossas Memórias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Press Start 2P", monospace;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .tela {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    #dialogo {
      font-size: clamp(12px, 2.5vw, 18px);
      line-height: 2.2;
      text-align: center;
      min-height: 180px;
      overflow-wrap: break-word;
    }

    #cursor {
      display: inline-block;
      animation: piscar 0.7s steps(2, start) infinite;
    }

    @keyframes piscar {
      to {
        visibility: hidden;
      }
    }

    #botao {
      display: none;
      margin: 25px auto 0;
      padding: 18px 14px;

      background: #000;
      color: #fff;
      border: 2px solid #fff;

      font-family: "Press Start 2P", monospace;
      font-size: clamp(9px, 2vw, 13px);
      line-height: 1.8;

      cursor: pointer;
      text-align: center;
    }

    #botao:hover,
    #botao:focus-visible {
      color: #ffff00;
      border-color: #ffff00;
      outline: none;
    }

    #botao.visivel {
      display: block;
    }
  </style>
</head>

<body>
  <main class="tela">
    <div id="dialogo"><span id="texto"></span><span id="cursor">▮</span></div>

    <button id="botao" type="button">
      [ começar a rever as memórias ]
    </button>
  </main>

  <script>
    const mensagem =
      "Eu lembro de cada momento com você, mas quero verificar, você se lembra de cada momento nosso?";

    const texto = document.getElementById("texto");
    const cursor = document.getElementById("cursor");
    const botao = document.getElementById("botao");

    let indice = 0;

    function escreverDialogo() {
      if (indice < mensagem.length) {
        texto.textContent += mensagem.charAt(indice);
        indice++;

        setTimeout(escreverDialogo, 45);
      } else {
        cursor.style.display = "none";
        botao.classList.add("visivel");
      }
    }

    escreverDialogo();

    botao.addEventListener("click", () => {
      // A próxima tela do quiz será adicionada aqui.
    });
  </script>
</body>
</html>
