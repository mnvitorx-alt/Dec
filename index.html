
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossas Memórias</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .tela {
      width: 100%;
      max-width: 700px;
      text-align: left;
    }

    #dialogo {
      font-size: clamp(18px, 4vw, 25px);
      line-height: 1.8;
      white-space: pre-wrap;
      min-height: 150px;
    }

    #cursor {
      display: inline-block;
      animation: piscar 0.7s steps(2, start) infinite;
    }

    @keyframes piscar {
      to {
        visibility: hidden;
      }
    }

    #botao {
      display: none;
      margin-top: 30px;
      padding: 14px 18px;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      font-family: inherit;
      font-size: clamp(14px, 3.5vw, 18px);
      cursor: pointer;
      text-align: center;
    }

    #botao:hover,
    #botao:focus-visible {
      color: #ffff00;
      border-color: #ffff00;
      outline: none;
    }

    #botao.visivel {
      display: inline-block;
    }
  </style>
</head>

<body>
  <main class="tela">
    <div id="dialogo"><span id="texto"></span><span id="cursor">▮</span></div>

    <button id="botao" type="button">
      [ começar a rever as memórias ]
    </button>
  </main>

  <script>
    const mensagem =
      "Eu lembro de cada momento com você, mas quero verificar, você se lembra de cada momento nosso?";

    const texto = document.getElementById("texto");
    const cursor = document.getElementById("cursor");
    const botao = document.getElementById("botao");

    let indice = 0;

    function escreverDialogo() {
      if (indice < mensagem.length) {
        texto.textContent += mensagem.charAt(indice);
        indice++;

        setTimeout(escreverDialogo, 45);
      } else {
        cursor.style.display = "none";
        botao.classList.add("visivel");
      }
    }

    escreverDialogo();

    botao.addEventListener("click", () => {
      // A próxima tela será adicionada aqui.
    });
  </script>
</body>
</html>
