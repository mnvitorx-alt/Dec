
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossas Memórias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: "Press Start 2P", monospace;
    }

    .tela {
      width: 100%;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .escondido {
      display: none !important;
    }

    /* INTRODUÇÃO */

    #tela-inicial {
      max-width: 950px;
      margin: 0 auto;
    }

    #dialogo {
      width: 100%;
      min-height: 180px;
      font-size: clamp(12px, 2.5vw, 18px);
      line-height: 2.2;
      overflow-wrap: break-word;
    }

    #cursor {
      display: inline-block;
      animation: piscar 0.7s steps(2, start) infinite;
    }

    @keyframes piscar {
      to {
        visibility: hidden;
      }
    }

    button {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      font-family: "Press Start 2P", monospace;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    button:hover:not(:disabled),
    button:focus-visible:not(:disabled) {
      color: #ffff00;
      border-color: #ffff00;
      outline: none;
    }

    #botao-inicio {
      display: none;
      margin: 25px auto 0;
      padding: 18px 14px;
      font-size: clamp(9px, 2vw, 13px);
      line-height: 1.8;
    }

    #botao-inicio.visivel {
      display: block;
    }

    /* QUIZ */

    #tela-quiz {
      justify-content: flex-start;
      padding-top: clamp(35px, 8vh, 75px);
    }

    #contador {
      color: #999;
      font-size: 10px;
      line-height: 2;
      margin-bottom: 25px;
    }

    #pergunta {
      width: 100%;
      max-width: 950px;
      margin: 0 0 30px;
      font-size: clamp(12px, 2.5vw, 18px);
      line-height: 2.2;
      overflow-wrap: break-word;
    }

    #alternativas {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .alternativa {
      flex: 1;
      min-width: 0;
      min-height: 65px;
      padding: 12px 8px;
      font-size: clamp(8px, 1.8vw, 12px);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    /* RESPOSTA SELECIONADA */

    .alternativa.selecionada {
      color: #ffff00;
      border-color: #ffff00;
      background: #191900;
    }

    .alternativa:disabled {
      cursor: default;
      opacity: 1;
    }

    .alternativa:disabled:not(.selecionada) {
      color: #888;
      border-color: #555;
    }

    /* FOTO DE CADA PERGUNTA */

    #area-foto {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 25px;
      overflow: hidden;
      border-radius: 8px;
    }

    #foto-pergunta {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin: 0 auto;

      /* A foto sempre começa borrada. */
      filter: blur(7px);

      transition: filter 0.8s ease;
    }

    /* A foto fica nítida após a escolha. */
    #foto-pergunta.revelada {
      filter: blur(0);
    }

    #instrucao {
      color: #999;
      font-size: 9px;
      line-height: 2;
      margin: 0 0 20px;
    }

    #botao-proximo,
    #botao-reiniciar {
      padding: 15px;
      font-size: 10px;
      line-height: 1.8;
    }

    /* RESULTADO FINAL */

    #mensagem-final {
      max-width: 800px;
      font-size: clamp(12px, 2.5vw, 18px);
      line-height: 2.3;
    }

    #pontuacao {
      color: #aaa;
      font-size: 11px;
      line-height: 2.2;
      margin: 25px 0;
    }

    @media (max-width: 380px) {
      #alternativas {
        gap: 6px;
      }

      .alternativa {
        padding: 10px 4px;
        font-size: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #foto-pergunta {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- PRIMEIRA TELA: DIÁLOGO -->

  <main id="tela-inicial" class="tela">
    <div id="dialogo">
      <span id="texto"></span><span id="cursor">▮</span>
    </div>

    <button id="botao-inicio" type="button">
      [ começar a rever as memórias ]
    </button>
  </main>

  <!-- SEGUNDA TELA: QUIZ -->

  <section id="tela-quiz" class="tela escondido">
    <p id="contador"></p>

    <h1 id="pergunta"></h1>

    <div id="alternativas">
      <button class="alternativa" data-opcao="A" type="button"></button>
      <button class="alternativa" data-opcao="B" type="button"></button>
      <button class="alternativa" data-opcao="C" type="button"></button>
    </div>

    <div id="area-foto">
      <img
        id="foto-pergunta"
        src=""
        alt="Foto da nossa lembrança"
      >
    </div>

    <p id="instrucao">Escolha a resposta que você lembra.</p>

    <button id="botao-proximo" class="escondido" type="button">
      [ continuar ]
    </button>
  </section>

  <!-- TERCEIRA TELA: RESULTADO -->

  <section id="tela-final" class="tela escondido">
    <p id="mensagem-final">
      Você chegou ao fim das nossas memórias.
    </p>

    <p id="pontuacao"></p>

    <button id="botao-reiniciar" type="button">
      [ rever novamente ]
    </button>
  </section>

  <script>
    // MENSAGEM DA INTRODUÇÃO

    const mensagem =
      "Eu lembro de cada momento com você, mas quero verificar, você se lembra de cada momento nosso?";

    const texto = document.getElementById("texto");
    const cursor = document.getElementById("cursor");
    const telaInicial = document.getElementById("tela-inicial");
    const telaQuiz = document.getElementById("tela-quiz");
    const telaFinal = document.getElementById("tela-final");

    const botaoInicio = document.getElementById("botao-inicio");
    const botaoProximo = document.getElementById("botao-proximo");
    const botaoReiniciar = document.getElementById("botao-reiniciar");

    const contador = document.getElementById("contador");
    const perguntaElemento = document.getElementById("pergunta");
    const alternativas = document.querySelectorAll(".alternativa");
    const instrucao = document.getElementById("instrucao");
    const foto = document.getElementById("foto-pergunta");
    const mensagemFinal = document.getElementById("mensagem-final");
    const pontuacao = document.getElementById("pontuacao");

    // PERGUNTAS E FOTOS

    const perguntas = [
      {
        pergunta: "Onde foi o nosso primeiro date?",
        A: "Shopping",
        B: "Parque",
        C: "Sorveteria",
        correta: "A",
        foto: "img/foto1.jpeg"
      },
      {
        pergunta: "O que mais marcou aquele momento?",
        A: "Nossa conversa",
        B: "Filme juntos",
        C: "O lugar",
        correta: "B",
        foto: "img/foto2.jpeg"
      },
      {
        pergunta: "Para onde saímos no nosso segundo date?",
        A: "Praia",
        B: "Pizzaria",
        C: "Parque",
        correta: "B",
        foto: "img/foto3.jpeg"
      },
      {
        pergunta: "Para onde saímos no nosso date com meus pais?",
        A: "Praia",
        B: "Morro de areia",
        C: "Parque",
        correta: "B",
        foto: "img/IMG_2364.jpeg"
      }
    ];

    let indiceTexto = 0;
    let temporizadorDigitacao = null;
    let indiceAtual = 0;
    let respostaEscolhida = null;
    let acertos = 0;

    // ESCREVER A INTRODUÇÃO LETRA POR LETRA

    function escreverDialogo() {
      if (indiceTexto < mensagem.length) {
        texto.textContent += mensagem.charAt(indiceTexto);
        indiceTexto++;

        temporizadorDigitacao = setTimeout(escreverDialogo, 45);
      } else {
        cursor.style.display = "none";
        botaoInicio.classList.add("visivel");
      }
    }

    // INICIAR O QUIZ

    botaoInicio.addEventListener("click", function () {
      telaInicial.classList.add("escondido");
      telaQuiz.classList.remove("escondido");

      indiceAtual = 0;
      acertos = 0;

      mostrarPergunta();
    });

    // CARREGAR PERGUNTA, ALTERNATIVAS E FOTO

    function mostrarPergunta() {
      respostaEscolhida = null;

      const atual = perguntas[indiceAtual];

      contador.textContent =
        "MEMÓRIA " + (indiceAtual + 1) + " / " + perguntas.length;

      perguntaElemento.textContent = atual.pergunta;

      // Liberar todas as alternativas para a nova pergunta.
      alternativas.forEach(function (botao) {
        const letra = botao.dataset.opcao;

        botao.textContent = letra + ") " + atual[letra];
        botao.classList.remove("selecionada");
        botao.disabled = false;
      });

      // Esconder o botão de continuar até escolher uma resposta.
      botaoProximo.classList.add("escondido");

      botaoProximo.textContent =
        indiceAtual === perguntas.length - 1
          ? "[ ver resultado ]"
          : "[ continuar ]";

      instrucao.textContent = "Escolha a resposta que você lembra.";

      // IMPORTANTE: borrar a foto ANTES de carregar a próxima.
      foto.classList.remove("revelada");
      foto.style.filter = "blur(7px)";

      foto.onerror = function () {
        console.error(
          "Não foi possível carregar a imagem. Confira o caminho:",
          atual.foto
        );
      };

      foto.onload = function () {
        // Garantir que a nova imagem continue borrada.
        if (respostaEscolhida === null) {
          foto.classList.remove("revelada");
          foto.style.filter = "blur(7px)";
        }
      };

      foto.src = atual.foto;
      foto.alt = "Foto da lembrança " + (indiceAtual + 1);
    }

    // ESCOLHER UMA ÚNICA ALTERNATIVA

    alternativas.forEach(function (botao) {
      botao.addEventListener("click", function () {

        // Se já escolheu, ignorar novos cliques.
        if (respostaEscolhida !== null) {
          return;
        }

        // Registrar definitivamente a escolha desta pergunta.
        respostaEscolhida = botao.dataset.opcao;

        // Desativar todas as opções e destacar apenas a escolhida.
        alternativas.forEach(function (opcao) {
          opcao.disabled = true;
          opcao.classList.remove("selecionada");
        });

        botao.classList.add("selecionada");

        // Revelar a foto somente depois da escolha.
        foto.classList.add("revelada");
        foto.style.filter = "blur(0px)";

        instrucao.textContent =
          "Resposta escolhida: " + respostaEscolhida;

        // Agora a pessoa pode continuar.
        botaoProximo.classList.remove("escondido");
      });
    });

    // AVANÇAR PARA A PRÓXIMA PERGUNTA

    botaoProximo.addEventListener("click", function () {
      if (respostaEscolhida === null) {
        return;
      }

      if (respostaEscolhida === perguntas[indiceAtual].correta) {
        acertos++;
      }

      indiceAtual++;

      if (indiceAtual < perguntas.length) {
        mostrarPergunta();
      } else {
        mostrarResultado();
      }
    });

    // MOSTRAR RESULTADO FINAL

    function mostrarResultado() {
      telaQuiz.classList.add("escondido");
      telaFinal.classList.remove("escondido");

      mensagemFinal.textContent =
        "Você chegou ao fim das nossas memórias.";

      pontuacao.textContent =
        "Você acertou " + acertos + " de " + perguntas.length +
        " perguntas. O mais importante é tudo que vivemos juntos.";
    }

    // RECOMEÇAR DESDE A INTRODUÇÃO

    botaoReiniciar.addEventListener("click", function () {
      clearTimeout(temporizadorDigitacao);

      telaFinal.classList.add("escondido");
      telaQuiz.classList.add("escondido");
      telaInicial.classList.remove("escondido");

      texto.textContent = "";
      cursor.style.display = "inline-block";
      botaoInicio.classList.remove("visivel");

      indiceTexto = 0;
      indiceAtual = 0;
      acertos = 0;
      respostaEscolhida = null;

      escreverDialogo();
    });

    // INICIAR A INTRODUÇÃO

    escreverDialogo();
  </script>

</body>
</html>
