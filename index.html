<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eu te amo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #frase {
      font-size: clamp(32px, 8vw, 60px);
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
      padding: 20px;
      z-index: 2;
    }

    #frase:hover {
      text-shadow: 0 0 20px #d9a3ff;
    }

    #imagem-final {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }

    #imagem-final.visivel {
      opacity: 1;
      visibility: visible;
    }

    .foto-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 75vh;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(170, 70, 255, 0.25);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .foto-container img {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* A foto desaparece enquanto as partículas explodem. */
    .foto-container.sumindo {
      opacity: 0;
      transform: scale(0.35) rotate(8deg);
      pointer-events: none;
    }

    .camada-roxa {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(145, 40, 255, 0.55);
      mix-blend-mode: color;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .glitters {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .glitter {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        0 0 6px 2px #fff,
        0 0 12px 4px #d9a3ff;
      animation: pulsar 1.8s ease-in-out infinite;
    }

    @keyframes pulsar {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.6);
      }

      50% {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    .mensagem-romantica {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(14px, 4vw, 28px);
      overflow-y: auto;
      background: rgba(35, 0, 65, 0.62);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overscroll-behavior: contain;
    }

    .mensagem-romantica p {
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(14px, 3.8vw, 19px);
      line-height: 1.65;
      text-align: center;
      text-shadow:
        0 0 8px rgba(200, 150, 255, 0.55),
        0 1px 4px rgba(0, 0, 0, 0.9);
      max-width: 440px;
      margin: auto;
    }

    .foto-container.efeito-ativo .camada-roxa {
      opacity: 1;
    }

    .foto-container.efeito-ativo .glitters {
      opacity: 1;
    }

    .foto-container.efeito-ativo .mensagem-romantica {
      opacity: 1;
      visibility: visible;
    }

    .particula {
      position: fixed;
      top: 50%;
      left: 50%;
      pointer-events: none;
      z-index: 10;
      animation: explodir var(--duracao) ease-out forwards;
    }

    @keyframes explodir {
      0% {
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(0)
          rotate(var(--rotacao));
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div id="frase">Eu te amo</div>

  <div id="imagem-final">
    <div class="foto-container" id="foto-interativa">
      <img
        src="img/IMG_2364.jpeg"
        alt="Espero que se lembre de mim com amor"
      >

      <div class="camada-roxa"></div>
      <div class="glitters"></div>

      <div class="mensagem-romantica">
        <p>
          Espero que se lembre de nós como pessoas boa vivendo um romance
          de comédia, que se lembre de nós como apenas dois adolescentes
          rindo, espero que me veja não como alguém que você deva se prender,
          mas sim alguém que você ama e soma…
          Espero que não me veja como minha pior fase.
        </p>
      </div>
    </div>
  </div>

  <script>
    const frase = document.getElementById("frase");
    const imagemFinal = document.getElementById("imagem-final");
    const fotoInterativa = document.getElementById("foto-interativa");
    const glitters = document.querySelector(".glitters");

    let iniciado = false;
    let fotoExplodindo = false;

    // Cria os 32 brilhos da foto.
    for (let i = 0; i < 32; i++) {
      const glitter = document.createElement("span");
      glitter.classList.add("glitter");

      glitter.style.left = Math.random() * 100 + "%";
      glitter.style.top = Math.random() * 100 + "%";
      glitter.style.animationDelay = Math.random() * 2 + "s";
      glitter.style.animationDuration =
        (1.2 + Math.random() * 1.5) + "s";

      glitters.appendChild(glitter);
    }

    // Função reutilizável para criar uma explosão de partículas.
    function criarExplosao(centroX, centroY, quantidade = 180) {
      for (let i = 0; i < quantidade; i++) {
        const particula = document.createElement("span");
        particula.classList.add("particula");

        particula.textContent = Math.random() > 0.45 ? "💜" : "♥";
        particula.style.fontSize =
          (10 + Math.random() * 22) + "px";

        // Distribui as partículas em todas as direções.
        const angulo = Math.random() * Math.PI * 2;
        const distancia = 100 + Math.random() * Math.max(
          window.innerWidth,
          window.innerHeight
        ) * 0.65;

        const x = Math.cos(angulo) * distancia;
        const y = Math.sin(angulo) * distancia;
        const duracao = 2.5 + Math.random() * 2;

        particula.style.left = centroX + "px";
        particula.style.top = centroY + "px";

        particula.style.setProperty("--x", x + "px");
        particula.style.setProperty("--y", y + "px");
        particula.style.setProperty(
          "--rotacao",
          (Math.random() * 720 - 360) + "deg"
        );
        particula.style.setProperty(
          "--duracao",
          duracao + "s"
        );

        document.body.appendChild(particula);

        setTimeout(() => {
          particula.remove();
        }, duracao * 1000);
      }
    }

    // PRIMEIRA ANIMAÇÃO: tocar em "Eu te amo".
    frase.addEventListener("click", () => {
      if (iniciado) return;
      iniciado = true;

      frase.style.opacity = "0";
      frase.style.transform = "scale(0.7)";
      frase.style.pointerEvents = "none";

      // A explosão começa no centro da tela.
      criarExplosao(
        window.innerWidth / 2,
        window.innerHeight / 2
      );

      setTimeout(() => {
        frase.style.display = "none";
      }, 800);

      // Mostra a foto depois da explosão inicial.
      setTimeout(() => {
        imagemFinal.classList.add("visivel");
      }, 4600);
    });

    // SEGUNDA ANIMAÇÃO: tocar na foto faz tudo explodir.
    fotoInterativa.addEventListener("click", () => {
      if (fotoExplodindo) return;
      fotoExplodindo = true;

      // Descobre o centro real da foto na tela.
      const retangulo = fotoInterativa.getBoundingClientRect();
      const centroX = retangulo.left + retangulo.width / 2;
      const centroY = retangulo.top + retangulo.height / 2;

      // Cria a explosão a partir da posição da foto.
      criarExplosao(centroX, centroY);

      // Faz a foto, a mensagem e os efeitos desaparecerem.
      fotoInterativa.classList.add("sumindo");

      // Depois, esconde completamente a camada da imagem.
      setTimeout(() => {
        imagemFinal.classList.remove("visivel");
      }, 400);
    });
  </script>

</body>
</html>
